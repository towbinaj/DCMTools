name: Build and Release

# Push a version tag to build the exe and publish it as a GitHub Release, which
# the in-app updater then offers to everyone:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content dcmtoolkit/__init__.py) `
            -replace '__version__\s*=\s*".*"', "__version__ = `"$v`"" |
            Set-Content dcmtoolkit/__init__.py
          Write-Host "Building DICOM Toolkit $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller DICOMToolkit.spec --noconfirm --clean

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/DICOMToolkit.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DICOMToolkit.exe" | Out-File -Encoding ascii dist/DICOMToolkit.exe.sha256
          Write-Host "SHA-256: $h"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DICOMToolkit.exe
            dist/DICOMToolkit.exe.sha256
          generate_release_notes: true
